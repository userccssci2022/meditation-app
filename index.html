<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Still</title>
<meta name="description" content="A quiet meditation timer with a breathing guide.">
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Still">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
<div class="scene" aria-hidden="true"></div>
<main class="app" id="app" data-state="idle">
  <header class="stats" aria-label="Your practice">
    <span><b id="statStreak">0</b> day streak</span>
    <span><b id="statCount">0</b> sessions</span>
    <span><b id="statMinutes">0</b> min</span>
  </header>

  <section class="stage">

      <div class="orb" id="orb"></div>

      <div class="readout">
        <div class="kanji" id="kanji" aria-hidden="true"></div>
        <div class="time" id="time" role="timer" aria-label="Time remaining">5:00</div>
        <div class="cue" id="cue" aria-live="polite">Ready</div>
      </div>
      <div class="seal" aria-hidden="true"></div>
    </div>
  </section>

  <section class="controls" id="settings">
    <div class="group">
      <h2 class="label" id="durLabel">Minutes</h2>
      <div class="lengths" role="radiogroup" aria-labelledby="durLabel" id="durations">
        <button type="button" role="radio" data-min="3">3</button>
        <button type="button" role="radio" data-min="5">5</button>
        <button type="button" role="radio" data-min="10">10</button>
        <button type="button" role="radio" data-min="15">15</button>
        <button type="button" role="radio" data-min="20">20</button>
        <label class="custom">
          <span class="sr">Custom minutes</span>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="other" id="customMin">
        </label>
      </div>
    </div>

    <button type="button" class="row" id="breathRow" aria-haspopup="dialog">
      <span class="label">Breath</span><span class="value" id="breathSummary"></span>
    </button>
    <button type="button" class="row" id="soundRow" aria-haspopup="dialog">
      <span class="label">Sound</span><span class="value" id="soundSummary"></span>
    </button>
  </section>

  <footer class="actions">
    <p class="hint" id="hint" role="status" hidden>Your screen may lock and silence the bells. Tip: set Auto-Lock to Never and turn off Low Power Mode.</p>
    <button type="button" class="secondary" id="endBtn" hidden>End</button>
    <button type="button" class="primary" id="startBtn">Begin</button>
  </footer>
</main>

<dialog class="sheet" id="breathSheet" aria-labelledby="patLabel">
  <div class="sheet-body">
    <header><h2 id="patLabel">Breath</h2><button type="button" class="done" data-close>Done</button></header>
    <div class="options" role="radiogroup" aria-labelledby="patLabel" id="patterns">
      <button type="button" role="radio" data-pattern="relax" data-short="Relax 4·6"><b>Relax</b><small>In 4 · out 6</small></button>
      <button type="button" role="radio" data-pattern="calm" data-short="Calm 5·5"><b>Calm</b><small>In 5 · out 5</small></button>
      <button type="button" role="radio" data-pattern="slow" data-short="Slow 6·9"><b>Slow</b><small>In 6 · out 9</small></button>
      <button type="button" role="radio" data-pattern="deep" data-short="Deep 8·12"><b>Deep</b><small>In 8 · out 12</small></button>
      <button type="button" role="radio" data-pattern="long" data-short="Long 10·15"><b>Long</b><small>In 10 · out 15</small></button>
      <button type="button" role="radio" data-pattern="478" data-short="4·7·8"><b>4·7·8</b><small>In 4 · hold 7 · out 8</small></button>
      <button type="button" role="radio" data-pattern="box" data-short="Box 4·4·4·4"><b>Box</b><small>In 4 · hold 4 · out 4 · hold 4</small></button>
      <button type="button" role="radio" data-pattern="sigh" data-short="Cyclic sigh"><b>Cyclic sigh</b><small>Two short inhales, one long exhale</small></button>
      <button type="button" role="radio" data-pattern="none" data-short="Off"><b>Off</b><small>Timer only, breathe naturally</small></button>
    </div>
  </div>
</dialog>

<dialog class="sheet" id="soundSheet" aria-labelledby="sndLabel">
  <div class="sheet-body">
    <header><h2 id="sndLabel">Sound</h2><button type="button" class="done" data-close>Done</button></header>
    <div class="options">
      <label class="switch"><span><b>Chimes</b><small>A bell to begin and to end</small></span><input type="checkbox" id="chimeToggle" checked><i></i></label>
      <label class="switch"><span><b>5-min bell</b><small>A soft strike every five minutes</small></span><input type="checkbox" id="intervalToggle"><i></i></label>
      <label class="switch"><span><b>Breath sound</b><small>A singing bowl on each breath</small></span><input type="checkbox" id="breathToggle"><i></i></label>
      <label class="switch"><span><b>Soft tone</b><small>A low, steady hum</small></span><input type="checkbox" id="toneToggle"><i></i></label>
    </div>
  </div>
</dialog>
<script src="app.js"></script>
</body>
</html>
